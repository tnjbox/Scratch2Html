<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>優化演算法</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
padding:40px;
display:flex;
justify-content:center;
}

.wrapper{
text-align:center;
}

.main{
display:flex;
gap:40px;
align-items:flex-start;
}

.grid{
display:grid;
grid-template-columns:repeat(6,60px);
grid-template-rows:repeat(6,60px);
gap:5px;
}

.cell{
border:1px solid #999;
border-radius:10px;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}

.start{background:#c8f7c5;}
.goal{background:#c9d9ff;}

.wall{
background:#888;
color:white;
}

.path{
background:#ffeaa7;
}

.current{
outline:3px solid red;
}

.controls{
margin-top:15px;
display:flex;
gap:10px;
}

button{
width:60px;
height:50px;
font-size:20px;
cursor:pointer;
}

.sidebar{
width:260px;
text-align:left;
}

textarea{
width:100%;
height:80px;
margin-top:8px;
}

.info{
margin-top:10px;
}

.result{
font-size:20px;
font-weight:bold;
margin-top:15px;
}

.success{color:green}
.fail{color:red}

</style>
</head>

<body>

<div class="wrapper">

<h2>優化演算法-依照任務目標調整策略</h2>

<div class="main">

<div>

<div id="grid" class="grid"></div>

<div class="controls">

<button onclick="move('上')">上</button>
<button onclick="move('下')">下</button>
<button onclick="move('左')">左</button>
<button onclick="move('右')">右</button>

<button onclick="undo()">復原</button>
<button onclick="resetGame()">重置</button>

</div>

</div>

<div class="sidebar">

<p>選取任務</p>

<select id="taskSelect">
<option value="T1">任務1：上限16步，取得最多數量金幣</option>
<option value="T2">任務2：16步，至少1愛心，最多數量金幣</option>
<option value="T3">任務3：最短路徑(10步)到終點G，最多數量金幣</option>
<option value="T4">任務4：16步，全部3愛心，最多數量金幣</option>
</select>

<p>我的演算法路徑</p>

<textarea id="algo"></textarea>

<div class="info">

<p>目前位置 <span id="pos"></span></p>
<p>剩餘步數 <span id="steps"></span></p>

<p>金幣 <span id="coins"></span></p>
<p>愛心 <span id="hearts"></span></p>
<p>炸彈 <span id="bombs"></span></p>

</div>

<div id="result" class="result"></div>

</div>

</div>

</div>

<script>

const SIZE=6

const START={x:1,y:1}
const GOAL={x:6,y:6}

const WALLS=new Set(["3,5","3,4","4,4"])
const HEARTS=new Set(["1,4","4,2","2,6"])
const BOMBS=new Set(["2,3","4,3","6,4"])

const COINS=new Map([
["5,1",3],
["6,2",3],
["5,6",3],
["6,5",3],
["4,1",2],
["5,2",2],
["5,4",2],
["4,5",2],
["2,2",1],
["3,6",1]
])

let path=[]
let coinSet=new Set()
let heartSet=new Set()
let bombSet=new Set()

const grid=document.getElementById("grid")

const pos=document.getElementById("pos")
const steps=document.getElementById("steps")

const coins=document.getElementById("coins")
const hearts=document.getElementById("hearts")
const bombs=document.getElementById("bombs")

const algo=document.getElementById("algo")
const result=document.getElementById("result")
const taskSelect=document.getElementById("taskSelect")

function key(x,y){
return x+","+y
}

function parse(k){
let a=k.split(",")
return {x:Number(a[0]),y:Number(a[1])}
}

function buildGrid(){

grid.innerHTML=""

for(let y=SIZE;y>=1;y--){

for(let x=1;x<=SIZE;x++){

let cell=document.createElement("div")
cell.className="cell"

let k=key(x,y)

if(k===key(START.x,START.y)){
cell.classList.add("start")
cell.innerHTML="S"
}
else if(k===key(GOAL.x,GOAL.y)){
cell.classList.add("goal")
cell.innerHTML="G"
}
else if(WALLS.has(k)){
cell.classList.add("wall")
cell.innerHTML="🧱"
}
else if(COINS.has(k)){
cell.innerHTML="🪙"+COINS.get(k)
}
else if(HEARTS.has(k)){
cell.innerHTML="❤️"
}
else if(BOMBS.has(k)){
cell.innerHTML="💣"
}

grid.appendChild(cell)

}

}

}

function resetGame(){

path=[key(START.x,START.y)]

coinSet.clear()
heartSet.clear()
bombSet.clear()

algo.value=""
result.innerText=""

update()

}

function move(dir){

let limit=16
if(taskSelect.value==="T3") limit=10

let stepsNow=path.length-1

if(stepsNow>=limit){
finishGame()
return
}

let cur=parse(path[path.length-1])

let nx=cur.x
let ny=cur.y

if(dir==="上") ny++
if(dir==="下") ny--
if(dir==="左") nx--
if(dir==="右") nx++

if(nx<1||nx>SIZE||ny<1||ny>SIZE){
alert("路徑錯誤：碰到邊界")
return
}

let nk=key(nx,ny)

if(WALLS.has(nk)){
alert("路徑錯誤：撞到牆壁")
return
}

path.push(nk)

algo.value+=dir

if(COINS.has(nk)) coinSet.add(nk)
if(HEARTS.has(nk)) heartSet.add(nk)
if(BOMBS.has(nk)) bombSet.add(nk)

update()

if(path.length-1>=limit){
finishGame()
}

}

function undo(){

if(path.length<=1) return

path.pop()

algo.value=algo.value.slice(0,-1)

coinSet.clear()
heartSet.clear()
bombSet.clear()

for(let i=1;i<path.length;i++){

let k=path[i]

if(COINS.has(k)) coinSet.add(k)
if(HEARTS.has(k)) heartSet.add(k)
if(BOMBS.has(k)) bombSet.add(k)

}

update()

}

function getCoin(){

let sum=0

coinSet.forEach(k=>sum+=COINS.get(k))

sum-=bombSet.size*2

if(sum<0) sum=0

return sum

}

function finishGame(){

let cur=parse(path[path.length-1])
let task=taskSelect.value

let taskNum=task.replace("T","")

let success=false

if(task==="T1") success=true
if(task==="T2") success=(heartSet.size>=1)
if(task==="T3") success=(cur.x===GOAL.x && cur.y===GOAL.y)
if(task==="T4") success=(heartSet.size>=3)

if(success){

result.innerHTML=
`任務${taskNum}成功<br>金幣:${getCoin()} ❤️:${heartSet.size} 💣:${bombSet.size}`

result.className="result success"

}else{

result.innerHTML=
`任務${taskNum}失敗<br>金幣:${getCoin()} ❤️:${heartSet.size} 💣:${bombSet.size}`

result.className="result fail"

}

}

function update(){

let cur=parse(path[path.length-1])

pos.innerText=`(${cur.x},${cur.y})`
steps.innerText=path.length-1

coins.innerText=getCoin()
hearts.innerText=heartSet.size
bombs.innerText=bombSet.size

render()

}

function render(){

let cells=grid.children

for(let i=0;i<cells.length;i++){
cells[i].classList.remove("path","current")
}

for(let i=1;i<path.length;i++){

let p=parse(path[i])

let index=(SIZE-p.y)*SIZE+(p.x-1)

cells[index].classList.add("path")

}

let cur=parse(path[path.length-1])

let index=(SIZE-cur.y)*SIZE+(cur.x-1)

cells[index].classList.add("current")

}

buildGrid()
resetGame()

</script>

</body>
</html>
