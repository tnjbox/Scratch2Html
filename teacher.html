<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時投票系統 - 教師控制端</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', Arial, sans-serif; background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: #34495e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; font-size: 32px; letter-spacing: 2px; }
        .status-bar { font-size: 20px; margin-bottom: 20px; color: #f1c40f; }
        .chart-container { position: relative; height: 40vh; width: 100%; margin-bottom: 30px; }
        .btn-reset { padding: 15px 40px; background-color: #e74c3c; color: white; font-size: 22px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn-reset:hover { background-color: #c0392b; }
        .btn-reset:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 課堂即時投票大盤</h1>
    <div class="status-bar" id="totalStatus">目前已投票人數：0 人</div>
    
    <div class="chart-container">
        <canvas id="voteChart"></canvas>
    </div>

    <button class="btn-reset" onclick="resetVoting()">🔄 重置本輪投票</button>
</div>

<script>
    // 🔗 貼上您最新部署的 GAS 網頁應用程式 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyK-FdTKV-cS3ZaCAm07410B1ytjNrWkEzM7u6sA53yVR8Qr1dt5D0nlBPuoRiLQd8y/exec"; 

    let voteChart;
    const ctx = document.getElementById('voteChart').getContext('2d');

    function initChart() {
        voteChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['A選項', 'B選項', 'C選項', 'D選項'],
                datasets: [{
                    label: '得票數',
                    data: [0, 0, 0, 0],
                    backgroundColor: ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71'],
                    borderWidth: 0,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: { color: '#fff', stepSize: 1, font: { size: 16 } }, grid: { color: 'rgba(255,255,255,0.1)' } },
                    x: { ticks: { color: '#fff', font: { size: 18, weight: 'bold' } }, grid: { display: false } }
                }
            }
        });
    }

    function fetchVotes() {
        // 抓取資料：指定 action=getStats，並加上時間戳防止快取
        fetch(`${GAS_URL}?action=getStats&t=${Date.now()}`)
        .then(response => response.json())
        .then(data => {
            voteChart.data.datasets[0].data = [data.A, data.B, data.C, data.D];
            voteChart.update();
            document.getElementById('totalStatus').innerText = `目前已投票人數：${data.total} 人`;
        })
        .catch(err => console.error("讀取資料失敗:", err));
    }

    function resetVoting() {
        if (confirm("確定要清空全班投票紀錄，開始新一輪投票嗎？")) {
            document.getElementById('totalStatus').innerText = "正在清除試算表...";
            
            // 重置資料：指定 action=reset，改用 GET 呼叫
            fetch(`${GAS_URL}?action=reset&t=${Date.now()}`)
            .then(response => response.json())
            .then(result => {
                if(result.status === "success") {
                    voteChart.data.datasets[0].data = [0, 0, 0, 0];
                    voteChart.update();
                    document.getElementById('totalStatus').innerText = "目前已投票人數：0 人 (已成功重置)";
                }
            })
            .catch(err => alert("重置失敗，請檢查網路:", err));
        }
    }

    initChart();
    fetchVotes();
    setInterval(fetchVotes, 2000); 
</script>

</body>
</html>
