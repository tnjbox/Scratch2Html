<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時互動系統 - 教師控制端</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', Arial, sans-serif; background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; background: #34495e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; font-size: 32px; letter-spacing: 2px; }
        
        /* 狀態顯示區 */
        .status-container { display: flex; justify-content: space-around; align-items: center; background-color: #2c3e50; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        .status-box { font-size: 22px; font-weight: bold; color: #f1c40f; }
        .q-box { font-size: 26px; font-weight: bold; color: #2ecc71; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        /* 控制區排版 */
        .controls-row { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn { padding: 12px 18px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn:active { transform: scale(0.95); }
        .btn-toggle { background-color: #34495e; color: white; border: 2px solid #7f8c8d; }
        .btn-toggle:hover { background-color: #7f8c8d; }
        
        .btn-next { background-color: #27ae60; color: white; font-size: 18px; }
        .btn-reset { background-color: #e67e22; color: white; }
        .btn-danger { background-color: #c0392b; color: white; }
        
        .setting-group { background-color: #7f8c8d; padding: 8px 12px; border-radius: 8px; font-size: 16px; font-weight: bold; display: flex; align-items: center; }
        .setting-group input { width: 45px; margin-left: 8px; padding: 5px; font-size: 16px; font-weight: bold; text-align: center; border: none; border-radius: 5px; }

        .hidden { display: none !important; }
        .chart-container { position: relative; height: 35vh; width: 100%; margin-bottom: 30px; }

        .details-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .seat-card { background: #7f8c8d; color: white; border-radius: 8px; padding: 8px 5px; box-shadow: inset 0 0 5px rgba(0,0,0,0.2); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .seat-name { font-size: 14px; opacity: 0.9; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .seat-vote { font-size: 24px; font-weight: bold; }
        
        .text-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; text-align: left; max-height: 45vh; overflow-y: auto; padding-right: 10px; }
        .text-list::-webkit-scrollbar { width: 8px; }
        .text-list::-webkit-scrollbar-track { background: #34495e; border-radius: 4px; }
        .text-list::-webkit-scrollbar-thumb { background: #7f8c8d; border-radius: 4px; }

        .text-item { background: #ecf0f1; color: #2c3e50; padding: 12px 15px; border-radius: 8px; font-size: 18px; font-weight: bold; border-left: 6px solid #3498db; }
        .text-item .name-tag { font-size: 14px; color: #7f8c8d; margin-bottom: 5px; border-bottom: 1px solid #bdc3c7; padding-bottom: 3px; }

        .voted-a { background-color: #e74c3c; } .voted-b { background-color: #f1c40f; color: #333; } .voted-c { background-color: #3498db; } .voted-d { background-color: #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 課堂互動大盤與歷程</h1>
    
    <div class="status-container">
        <div class="q-box" id="qStatus">📌 目前題號：載入中...</div>
        <div class="status-box" id="totalStatus">🟢 已投票人數：0 人</div>
    </div>
    
    <div class="controls-row">
        <div class="setting-group">班級人數 <input type="number" id="studentCount" value="35" min="1" max="50"></div>
        <button class="btn btn-toggle" onclick="toggleSection('sectionA')">📋 開/關明細</button>
        <button class="btn btn-toggle" onclick="toggleSection('sectionB')">📊 開/關圖表</button>
        <button class="btn btn-toggle" onclick="toggleSection('sectionC')">📝 開/關文字</button>
    </div>

    <div class="controls-row" style="margin-bottom: 25px;">
        <button class="btn btn-next" onclick="nextQuestion()">⏭️ 進入下一題</button>
        <button class="btn btn-reset" onclick="resetCurrent()">🔄 清空本題</button>
        <button class="btn btn-danger" onclick="resetAll()">⚠️ 系統初始化 (回第1題)</button>
    </div>

    <div id="sectionA" class="hidden"><div class="details-grid" id="detailsGrid"></div></div>
    <div id="sectionB" class="hidden"><div class="chart-container"><canvas id="voteChart"></canvas></div></div>
    <div id="sectionC" class="hidden"><div class="text-list" id="textList"></div></div>
</div>

<script>
    // 🔗 貼上您的 GAS 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzcTuJoyN0kBI1bmmGmxOVoQCpMA2haE0ZAUHbDVEW6KVM85kTTm507JJIcMhXCFsOf/exec"; 

    let voteChart;
    const ctx = document.getElementById('voteChart').getContext('2d');
    let currentDisplayCount = 35; 

    function toggleSection(id) { document.getElementById(id).classList.toggle('hidden'); }

    function initChart() {
        voteChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['A選項', 'B選項', 'C選項', 'D選項'], datasets: [{ label: '得票數', data: [0, 0, 0, 0], backgroundColor: ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71'], borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: '#fff', stepSize: 1 } }, x: { ticks: { color: '#fff', font: { size: 16, weight: 'bold' } } } } }
        });
    }

    function renderDetails(displayDetails) {
        const grid = document.getElementById('detailsGrid');
        if (grid.children.length !== currentDisplayCount) {
            grid.innerHTML = ''; 
            displayDetails.forEach(d => {
                const card = document.createElement('div');
                card.id = 'seat-' + d.seat;
                grid.appendChild(card);
            });
        }
        displayDetails.forEach(d => {
            const card = document.getElementById('seat-' + d.seat);
            if(card) {
                let seatStr = d.seat < 10 ? '0' + d.seat : d.seat;
                if (d.vote) {
                    card.className = 'seat-card voted-' + d.vote.toLowerCase();
                    card.innerHTML = `<div class="seat-name">${seatStr} ${d.name}</div><div class="seat-vote">${d.vote}</div>`;
                } else {
                    card.className = 'seat-card';
                    card.innerHTML = `<div class="seat-name">${seatStr} ${d.name}</div><div class="seat-vote">--</div>`;
                }
            }
        });
    }

    function renderTextResponses(displayDetails) {
        const list = document.getElementById('textList');
        let htmlStr = '';
        let hasText = false;
        const sortedDetails = [...displayDetails].sort((a, b) => a.seat - b.seat);

        sortedDetails.forEach(d => {
            if (d.text) {
                hasText = true;
                let seatStr = d.seat < 10 ? '0' + d.seat : d.seat;
                htmlStr += `<div class="text-item"><div class="name-tag">👤 ${seatStr} 號 ${d.name}</div><div>${d.text}</div></div>`;
            }
        });
        list.innerHTML = hasText ? htmlStr : '<div style="color:#bdc3c7; text-align:center; padding: 20px;">本題尚無學生傳送文字回應</div>';
    }

    function fetchVotes() {
        fetch(`${GAS_URL}?action=getStats&t=${Date.now()}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('qStatus').innerText = `📌 目前題號：第 ${data.currentQ} 題`;
            document.getElementById('totalStatus').innerText = `🟢 已投票人數：${data.total} 人`;
            
            voteChart.data.datasets[0].data = [data.A, data.B, data.C, data.D];
            voteChart.update();
            
            if (data.details) {
                const displayDetails = data.details.slice(0, currentDisplayCount);
                renderDetails(displayDetails);
                renderTextResponses(displayDetails);
            }
        }).catch(err => console.error("讀取失敗:", err));
    }

    // 💡 修正：如果傳入的 confirmMessage 是 null，就直接跳過確認視窗執行
    function executeAction(actionType, confirmMessage, loadingText) {
        if (!confirmMessage || confirm(confirmMessage)) {
            let inputCount = parseInt(document.getElementById('studentCount').value, 10);
            if (!isNaN(inputCount) && inputCount > 0) currentDisplayCount = inputCount;

            document.getElementById('totalStatus').innerText = `🟡 ${loadingText}`;
            
            fetch(`${GAS_URL}?action=${actionType}&t=${Date.now()}`)
            .then(response => response.json())
            .then(result => {
                if(result.status === "success") {
                    document.getElementById('sectionA').classList.add('hidden');
                    document.getElementById('sectionB').classList.add('hidden');
                    document.getElementById('sectionC').classList.add('hidden');
                    fetchVotes();
                }
            }).catch(err => alert("執行失敗，請檢查網路:", err));
        }
    }

    // 💡 修正：將第二個參數設為 null，就不會跳出提示對話方塊了
    function nextQuestion() {
        executeAction("nextQ", null, "正在切換題號...");
    }

    // 清空與初始化依然保留確認視窗，避免誤觸
    function resetCurrent() {
        executeAction("resetCurrent", "確定要清空【本題】的作答紀錄嗎？\n(不會影響其他題目的歷程)", "正在清除本題資料...");
    }

    function resetAll() {
        executeAction("resetAll", "⚠️ 警告：確定要系統初始化嗎？\n這將會【刪除所有題目的學習歷程】，並回到第 1 題！\n(建議在換新班級上課時才使用)", "系統初始化中...");
    }

    initChart();
    fetchVotes();
    setInterval(fetchVotes, 2000); 
</script>

</body>
</html>
